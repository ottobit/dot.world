<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot World</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbf9; --panel: #f4f3ef; --line: #e2e0da;
    --text: #1c1b19; --muted: #6f6d68; --accent: #0f766e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --panel: #1d1d22; --line: #2c2c33;
            --text: #e9e9ec; --muted: #9a9aa2; --accent: #5eead4; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: grid; grid-template-columns: 1fr 320px; height: 100vh;
  }
  @media (max-width: 820px) { body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  canvas { flex: 1; width: 100%; min-height: 0; cursor: pointer; }
  .bar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel);
  }
  button {
    font: inherit; padding: 5px 12px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  aside {
    border-left: 1px solid var(--line); background: var(--panel);
    padding: 16px; overflow-y: auto; min-width: 0;
  }
  @media (max-width: 820px) { aside { border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; } }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: -0.01em; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--muted); margin: 20px 0 6px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  pre {
    margin: 0; padding: 10px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; font-size: 11px; line-height: 1.45; overflow-x: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
  <main>
    <canvas id="canvas"></canvas>
    <div class="bar">
      <button id="playpause" type="button">Pause</button>
      <button id="stepone" type="button">Step</button>
      <button id="restart" type="button">Restart</button>
      <label>Speed
        <select id="speed">
          <option value="1">1x</option>
          <option value="2" selected>2x</option>
          <option value="4">4x</option>
          <option value="8">8x</option>
        </select>
      </label>
      <span class="sub" id="mode"></span>
    </div>
  </main>

  <aside>
    <h1>Dot World</h1>
    <p class="sub">Many dots, each deciding on its own. They never talk — they
      only leave marks the others can feel.</p>

    <h2>World</h2>
    <dl id="stats"></dl>

    <h2>Topics</h2>
    <div class="legend" id="legend"></div>

    <h2>Inspector</h2>
    <p class="sub" id="inspector-hint">Click a dot to see exactly what it perceives and why it acted.</p>
    <div id="inspector"></div>
  </aside>

  <script type="module" src="./main.ts"></script>
</body>
</html>
