name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  code:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  wiki:
    # Separate job on purpose: the coherence layer is checked independently of
    # the build, and strictly. Staleness and orphans warn locally so an
    # in-progress branch is never blocked; here they fail the pull request.
    name: wiki lint (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the staleness check reads per-file commit dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:wiki:strict
